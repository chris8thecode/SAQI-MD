name: SAQI-MD 24/7
on:
  schedule:
    - cron: '10 0,6,12,18 * * *'   # har 6 ghante (job cap 6h se pehle khatam)
  workflow_dispatch: {}             # manual start bhi
concurrency:
  group: saqi-md-bot
  cancel-in-progress: false        # double-session conflict se bachne ke liye ek hi run
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355           # 6h cap (360) se pehle saaf exit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Run bot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_NUMBERS: ${{ secrets.OWNER_NUMBERS }}
          PORT: 3000
        run: timeout 21100 node worker.js || true
